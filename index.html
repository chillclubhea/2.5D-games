<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸訓練日記 · 專業版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-gold: #ffd700;
            --bg-gradient: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); min-height: 100vh; color: white; overflow-x: hidden; }
        
        /* 導航 */
        .nav-bar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1rem; cursor: pointer; transition: 0.3s; padding: 5px 10px; }
        .nav-btn.active { color: var(--primary-gold); font-weight: bold; }

        /* 頁面切換 */
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .container { max-width: 480px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }

        /* 練習卡片 */
        .practice-list { display: flex; flex-direction: column; gap: 12px; }
        .practice-card { background: rgba(255,255,255,0.08); padding: 18px; border-radius: 16px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; position: relative; }
        .practice-card:hover { background: rgba(255,255,255,0.12); }
        .practice-card.selected { border-color: var(--primary-gold); background: rgba(255,215,0,0.05); }
        .practice-card h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--primary-gold); }
        .practice-card p { font-size: 0.85rem; opacity: 0.7; }

        /* 控制面板 */
        .control-panel { margin-top: 20px; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; display: none; }
        .level-group { display: flex; gap: 10px; margin: 15px 0; }
        .btn-level { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.3); background: none; color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .btn-level.active { background: var(--primary-gold); color: black; border-color: var(--primary-gold); }
        
        .slider-box { margin-bottom: 15px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; appearance: none; background: #444; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: var(--primary-gold); border-radius: 50%; cursor: pointer; }

        /* 呼吸動畫區域 */
        .breathing-area { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        
        /* 一般呼吸圓圈 */
        .breath-circle { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fceabb, #f8b500); box-shadow: 0 0 50px rgba(255, 215, 0, 0.3); transition: transform 1s linear; display: flex; align-items: center; justify-content: center; }
        
        /* 腹式呼吸模式（肚子） */
        .breath-circle.belly-mode { width: 180px; height: 120px; border-radius: 50% / 60% 60% 40% 40%; background: radial-gradient(circle at center, #ffdb99, #e69500); }
        
        .phase-label { font-size: 1.8rem; font-weight: bold; color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
        .timer-display { font-size: 4rem; font-weight: 200; margin: 10px 0; text-align: center; }

        /* 按鈕 */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary-gold); color: #000; }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-danger { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }

        /* 紀錄卡片 */
        .log-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home')">🏠 訓練</button>
        <button class="nav-btn" onclick="showPage('records')">📋 紀錄</button>
        <button class="nav-btn" onclick="showPage('stats')">📈 統計</button>
    </nav>

    <div id="home" class="page active">
        <div class="container">
            <h1>呼吸練習</h1>
            <div class="practice-list" id="practiceList"></div>

            <div class="control-panel" id="controlPanel">
                <div id="levelSection">
                    <p style="font-size: 0.8rem; opacity: 0.7;">訓練強度</p>
                    <div class="level-group">
                        <button class="btn-level active" onclick="setLevel('simple')">簡單</button>
                        <button class="btn-level" onclick="setLevel('advanced')">進階</button>
                        <button class="btn-level" onclick="setLevel('pro')">高階</button>
                    </div>
                </div>

                <div id="manualSliders">
                    <div class="slider-box">
                        <div class="slider-header"><span>吸氣時間</span><span id="txtIn">4s</span></div>
                        <input type="range" id="rangeIn" min="2" max="15" value="4">
                    </div>
                    <div class="slider-box">
                        <div class="slider-header"><span>吐氣時間</span><span id="txtEx">6s</span></div>
                        <input type="range" id="rangeEx" min="2" max="20" value="6">
                    </div>
                </div>
                <button class="btn btn-primary" id="startBtn" onclick="startSession()">開始練習</button>
            </div>
        </div>
    </div>

    <div id="training" class="page">
        <div class="container" style="text-align: center;">
            <h2 id="curTitle" style="color:var(--primary-gold)">練習中</h2>
            <div class="breathing-area">
                <div class="breath-circle" id="circle">
                    <span class="phase-label" id="phaseTxt">準備</span>
                </div>
            </div>
            <div class="timer-display" id="timerTxt">0</div>
            <div style="display:flex; justify-content: space-around; margin: 20px 0; opacity: 0.8;">
                <div><small>總次數</small><div id="statCycles" style="font-size:1.5rem">0</div></div>
                <div><small>累計時間</small><div id="statTime" style="font-size:1.5rem">0:00</div></div>
            </div>
            <button class="btn btn-danger" onclick="stopSession()">結束並儲存</button>
        </div>
    </div>

    <div id="records" class="page">
        <div class="container">
            <h2>歷史紀錄</h2>
            <div id="logContainer" style="margin-top:20px"></div>
        </div>
    </div>

    <div id="stats" class="page">
        <div class="container">
            <h2>進度統計</h2>
            <div style="height: 300px; margin-top: 20px;">
                <canvas id="statChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Supabase
        const CONFIG = {
            URL: 'https://fayorxvfxtrycjiiiyfu.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZheW9yeHZmeHRyeWNqaWlpeWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzY1MTAsImV4cCI6MjA3OTg1MjUxMH0.7znE_AaNg6zESUO-RoSsyFqxCgcxjPT_pQiN557e6Nw'
        };
        
        // 解決重複宣告問題
        if (!window.supabaseClient) {
            window.supabaseClient = window.supabase ? window.supabase.createClient(CONFIG.URL, CONFIG.KEY) : null;
        }

        const practices = [
            { id: 1, name: '3D腹式呼吸', desc: '腹部全方位擴張 (側重肚子起伏)', type: 'belly', levels: { simple: [4,6], advanced: [5,7], pro: [6,8] } },
            { id: 2, name: '吸氣長度訓練', desc: '強化吸氣深度', type: 'length_in', levels: { simple: [4,6], advanced: [6,6], pro: [10,6] } },
            { id: 3, name: '吐氣長度訓練', desc: '強化副交感神經', type: 'length_out', levels: { simple: [4,6], advanced: [4,10], pro: [4,15] } },
            { id: 4, name: '1:2 呼吸法', desc: '情緒急救包 (自動鎖定比例)', type: 'ratio_12', levels: { simple: [3,6], advanced: [4,8], pro: [5,10] } },
            { id: 5, name: '單鼻吸氣法', desc: '右鼻(能量) / 左鼻(放鬆)', type: 'single', levels: { simple: [4,4], advanced: [6,6], pro: [8,8] } }
        ];

        let state = {
            sel: null, level: 'simple',
            in: 4, ex: 6,
            isRun: false, sec: 0, pSec: 0, phase: 'in', cycles: 0, timer: null
        };

        let myChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderList();
            setupInputs();
        });

        function renderList() {
            const list = document.getElementById('practiceList');
            list.innerHTML = practices.map(p => `
                <div class="practice-card" onclick="selectPractice(${p.id})">
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                </div>
            `).join('');
        }

        function selectPractice(id) {
            state.sel = practices.find(p => p.id === id);
            document.querySelectorAll('.practice-card').forEach((c, idx) => {
                c.classList.toggle('selected', (idx + 1) === id);
            });

            document.getElementById('controlPanel').style.display = 'block';
            
            // 如果是 1:2 呼吸，特別處理
            setLevel(state.level);
            
            const btn = document.getElementById('startBtn');
            btn.disabled = false;
            btn.innerText = `開始「${state.sel.name}」`;
        }

        function setLevel(lv) {
            state.level = lv;
            document.querySelectorAll('.btn-level').forEach(b => {
                b.classList.toggle('active', b.innerText === (lv==='simple'?'簡單':lv==='advanced'?'進階':'高階'));
            });

            const vals = state.sel.levels[lv];
            state.in = vals[0];
            state.ex = vals[1];
            updateSliderUI();
        }

        function setupInputs() {
            const rIn = document.getElementById('rangeIn');
            const rEx = document.getElementById('rangeEx');

            rIn.oninput = (e) => {
                state.in = parseInt(e.target.value);
                // 1:2 邏輯
                if (state.sel && state.sel.type === 'ratio_12') {
                    state.ex = state.in * 2;
                }
                updateSliderUI();
            };

            rEx.oninput = (e) => {
                state.ex = parseInt(e.target.value);
                // 如果是 1:2 且手動調吐氣，不連動但顯示警告（或可自由調整）
                updateSliderUI();
            };
        }

        function updateSliderUI() {
            document.getElementById('rangeIn').value = state.in;
            document.getElementById('rangeEx').value = state.ex;
            document.getElementById('txtIn').innerText = state.in + 's';
            document.getElementById('txtEx').innerText = state.ex + 's';
        }

        function startSession() {
            showPage('training');
            state.isRun = true;
            state.sec = 0;
            state.pSec = 0;
            state.cycles = 0;
            state.phase = 'in';
            
            document.getElementById('curTitle').innerText = state.sel.name;
            document.getElementById('circle').className = 'breath-circle' + (state.sel.type === 'belly' ? ' belly-mode' : '');
            
            runCycle();
            state.timer = setInterval(tick, 1000);
        }

        function tick() {
            state.sec++;
            state.pSec++;

            const target = (state.phase === 'in') ? state.in : state.ex;
            document.getElementById('timerTxt').innerText = Math.max(0, target - state.pSec);
            
            // 總時間
            const m = Math.floor(state.sec / 60);
            const s = state.sec % 60;
            document.getElementById('statTime').innerText = `${m}:${s.toString().padStart(2, '0')}`;

            if (state.pSec >= target) {
                state.pSec = 0;
                if (state.phase === 'in') {
                    state.phase = 'ex';
                } else {
                    state.phase = 'in';
                    state.cycles++;
                    document.getElementById('statCycles').innerText = state.cycles;
                }
                runCycle();
            }
        }

        function runCycle() {
            const circle = document.getElementById('circle');
            const txt = document.getElementById('phaseTxt');
            
            if (state.phase === 'in') {
                txt.innerText = '吸氣';
                circle.style.transition = `transform ${state.in}s linear`;
                circle.style.transform = 'scale(1.5)';
            } else {
                txt.innerText = '吐氣';
                circle.style.transition = `transform ${state.ex}s linear`;
                circle.style.transform = 'scale(0.8)';
            }
        }

        async function stopSession() {
            clearInterval(state.timer);
            const record = {
                practice_name: state.sel.name,
                duration_seconds: state.sec,
                cycles: state.cycles,
                notes: `吸${state.in}/吐${state.ex} (${state.level})`,
                created_at: new Date().toISOString()
            };

            // 儲存
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]');
            logs.unshift(record);
            localStorage.setItem('breath_logs_v2', JSON.stringify(logs.slice(0, 50)));

            if (window.supabaseClient) {
                await window.supabaseClient.from('practice_records').insert([record]);
            }

            alert('練習完成！');
            showPage('home');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(id));
            });

            if (id === 'records') loadLogs();
            if (id === 'stats') renderChart();
        }

        function loadLogs() {
            const container = document.getElementById('logContainer');
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]');
            
            if (!logs.length) {
                container.innerHTML = '<p style="text-align:center; opacity:0.5;">尚無紀錄</p>';
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <div>
                        <div style="font-weight:bold">${l.practice_name}</div>
                        <small style="opacity:0.6">${new Date(l.created_at).toLocaleDateString()} · ${l.notes}</small>
                    </div>
                    <div style="text-align:right">
                        <div style="color:var(--primary-gold)">${l.cycles} 回</div>
                        <small>${Math.floor(l.duration_seconds/60)}分${l.duration_seconds%60}秒</small>
                    </div>
                </div>
            `).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('statChart').getContext('2d');
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]').reverse();
            
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => new Date(l.created_at).getDate() + '日'),
                    datasets: [{
                        label: '練習循環數',
                        data: logs.map(l => l.cycles),
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255, 215, 0, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
