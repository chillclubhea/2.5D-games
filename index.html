<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸訓練 · 一次性密碼解鎖版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 樣式保持與之前完全相同，這裡省略以節省篇幅，但實際使用時請保留原本完整樣式 */
        :root {
            --primary-gold: #ffd700;
            --bg-gradient: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            --danger: #ff4757;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); min-height: 100vh; color: white; overflow-x: hidden; }
        .nav-bar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1rem; cursor: pointer; transition: 0.3s; padding: 5px 10px; }
        .nav-btn.active { color: var(--primary-gold); font-weight: bold; }
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 480px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
        .section-title { font-size: 1.2rem; margin: 20px 0 10px; color: var(--primary-gold); border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; }
        .practice-list { display: flex; flex-direction: column; gap: 12px; }
        .practice-card { background: rgba(255,255,255,0.08); padding: 18px; border-radius: 16px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; position: relative; }
        .practice-card:hover { background: rgba(255,255,255,0.12); }
        .practice-card.selected { border-color: var(--primary-gold); background: rgba(255,215,0,0.05); }
        .practice-card.locked { opacity: 0.5; cursor: not-allowed; background: rgba(0,0,0,0.3); }
        .practice-card.locked::after { content: "🔒"; position: absolute; top: 10px; right: 15px; font-size: 1.2rem; }
        .practice-card h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--primary-gold); }
        .practice-card p { font-size: 0.85rem; opacity: 0.7; }
        .control-panel { margin-top: 20px; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; display: none; }
        .level-group { display: flex; gap: 10px; margin: 15px 0; }
        .btn-level { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.3); background: none; color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .btn-level.active { background: var(--primary-gold); color: black; border-color: var(--primary-gold); }
        .slider-box { margin-bottom: 15px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; appearance: none; background: #444; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: var(--primary-gold); border-radius: 50%; cursor: pointer; }
        .unlock-area { margin: 20px 0; text-align: center; }
        .btn-unlock { background: rgba(255,215,0,0.1); border: 1px dashed var(--primary-gold); color: var(--primary-gold); padding: 12px; border-radius: 30px; width: 100%; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-unlock:hover { background: rgba(255,215,0,0.2); }
        .breathing-area { position: relative; height: 300px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .breath-circle { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fceabb, #f8b500); box-shadow: 0 0 50px rgba(255, 215, 0, 0.3); transition: transform 1s linear; display: flex; align-items: center; justify-content: center; }
        .breath-circle.belly-mode { width: 180px; height: 120px; border-radius: 50% / 60% 60% 40% 40%; background: radial-gradient(circle at center, #ffdb99, #e69500); }
        .phase-label { font-size: 1.8rem; font-weight: bold; color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
        .timer-display { font-size: 4rem; font-weight: 200; margin: 10px 0; text-align: center; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary-gold); color: #000; }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-danger { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .log-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .warning { background: rgba(255, 71, 87, 0.2); border-left: 5px solid var(--danger); padding: 12px; margin: 15px 0; border-radius: 8px; font-size: 0.9rem; }
        .warning strong { color: var(--danger); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: #1e1e1e; padding: 25px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; }
        .modal-box input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 8px; background: #333; color: white; font-size: 1rem; }
        .modal-box .btn { margin: 5px; }
    </style>
</head>
<body>

    <!-- 自訂密碼模態框 -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-box">
            <h3 style="color:var(--primary-gold);">🔐 解鎖進階練習</h3>
            <input type="password" id="unlockPassword" placeholder="請輸入一次性密碼">
            <button class="btn btn-primary" onclick="verifyPassword()">確認</button>
            <button class="btn" style="background:#333;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home')">🏠 訓練</button>
        <button class="nav-btn" onclick="showPage('records')">📋 紀錄</button>
        <button class="nav-btn" onclick="showPage('stats')">📈 統計</button>
    </nav>

    <!-- 首頁：練習選擇 -->
    <div id="home" class="page active">
        <div class="container">
            <h1>呼吸練習</h1>
            <div class="section-title">🌱 基礎練習</div>
            <div class="practice-list" id="basicPracticeList"></div>

            <div id="unlockButtonContainer" class="unlock-area">
                <button class="btn-unlock" onclick="showPasswordModal()">🔓 解鎖進階練習</button>
            </div>

            <div id="advancedSection" style="display: none;">
                <div class="section-title">⚡ 進階練習</div>
                <div class="practice-list" id="advancedPracticeList"></div>
            </div>

            <div class="control-panel" id="controlPanel">
                <div id="levelSection">
                    <p style="font-size: 0.8rem; opacity: 0.7;">訓練強度</p>
                    <div class="level-group">
                        <button class="btn-level active" onclick="setLevel('simple')">簡單</button>
                        <button class="btn-level" onclick="setLevel('advanced')">進階</button>
                        <button class="btn-level" onclick="setLevel('pro')">高階</button>
                    </div>
                </div>

                <div id="manualSliders">
                    <div class="slider-box">
                        <div class="slider-header"><span>吸氣時間</span><span id="txtIn">4s</span></div>
                        <input type="range" id="rangeIn" min="2" max="15" value="4">
                    </div>
                    <div class="slider-box">
                        <div class="slider-header"><span>吐氣時間</span><span id="txtEx">6s</span></div>
                        <input type="range" id="rangeEx" min="2" max="20" value="6">
                    </div>
                </div>

                <div id="safetyWarning" class="warning" style="display: none;">
                    <strong>⚠️ 安全提醒：</strong> 高血壓、心臟病、青光眼、懷孕者請勿嘗試。頭暈立即停止。
                </div>

                <button class="btn btn-primary" id="startBtn" onclick="startSession()" disabled>開始練習</button>
            </div>
        </div>
    </div>

    <!-- 訓練頁面 -->
    <div id="training" class="page">
        <div class="container" style="text-align: center;">
            <h2 id="curTitle" style="color:var(--primary-gold)">練習中</h2>
            <div class="breathing-area">
                <div class="breath-circle" id="circle">
                    <span class="phase-label" id="phaseTxt">準備</span>
                </div>
            </div>
            <div class="timer-display" id="timerTxt">0</div>
            <div style="display:flex; justify-content: space-around; margin: 20px 0; opacity: 0.8;">
                <div><small>總次數</small><div id="statCycles" style="font-size:1.5rem">0</div></div>
                <div><small>累計時間</small><div id="statTime" style="font-size:1.5rem">0:00</div></div>
            </div>
            <button class="btn btn-danger" onclick="stopSession()">結束並儲存</button>
        </div>
    </div>

    <!-- 紀錄頁面 -->
    <div id="records" class="page">
        <div class="container">
            <h2>歷史紀錄</h2>
            <div id="logContainer" style="margin-top:20px"></div>
        </div>
    </div>

    <!-- 統計頁面 -->
    <div id="stats" class="page">
        <div class="container">
            <h2>進度統計</h2>
            <div style="height: 300px; margin-top: 20px;">
                <canvas id="statChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ==================== Supabase 初始化 ====================
        const CONFIG = {
            URL: 'https://fayorxvfxtrycjiiiyfu.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZheW9yeHZmeHRyeWNqaWlpeWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzY1MTAsImV4cCI6MjA3OTg1MjUxMH0.7znE_AaNg6zESUO-RoSsyFqxCgcxjPT_pQiN557e6Nw'
        };
        const supabase = window.supabase.createClient(CONFIG.URL, CONFIG.KEY);

        // ==================== 全域狀態 ====================
        let state = {
            sel: null,
            level: 'simple',
            in: 4, ex: 6,
            isRun: false,
            sec: 0, pSec: 0,
            phase: 'in',
            cycles: 0,
            timer: null,
            phaseQueue: [],
            phaseIndex: 0,
            totalPhases: 0,
            safetyAcknowledged: false,
            advancedUnlocked: localStorage.getItem('advanced_unlocked') === 'true'
        };

        // ==================== 練習資料庫 ====================
        const basicPractices = [
            { id: 1, name: '3D腹式呼吸', desc: '腹部全方位擴張', type: 'belly', levels: { simple: [4,6], advanced: [5,7], pro: [6,8] } },
            { id: 2, name: '吸氣長度訓練', desc: '強化吸氣深度', type: 'length_in', levels: { simple: [4,6], advanced: [6,6], pro: [10,6] } },
            { id: 3, name: '吐氣長度訓練', desc: '強化副交感神經', type: 'length_out', levels: { simple: [4,6], advanced: [4,10], pro: [4,15] } },
            { id: 4, name: '1:2 呼吸法', desc: '情緒急救包', type: 'ratio_12', levels: { simple: [3,6], advanced: [4,8], pro: [5,10] } },
            { id: 5, name: '單鼻吸氣法', desc: '右鼻(能量)/左鼻(放鬆)', type: 'single', levels: { simple: [4,4], advanced: [6,6], pro: [8,8] } }
        ];

        const advancedPractices = [
            { id: 101, name: '分段式呼吸', desc: '吸→停→吸→停→吸→吐', type: 'segmented_in', hasHold: true, requiresSafety: false },
            { id: 102, name: '分段吐氣', desc: '吐→停→吐→停→吐→停', type: 'segmented_out', hasHold: true, requiresSafety: false },
            { id: 103, name: '4-7-8 呼吸法', desc: '吸4屏7吐8', type: '478', hasHold: true, requiresSafety: false },
            { id: 104, name: '延長吐氣練習', desc: '吸氣固定，吐氣越長越好', type: 'extend_exhale', hasHold: false, requiresSafety: false },
            { id: 105, name: '死蟲式呼吸', desc: '吐氣時核心收緊', type: 'deadbug', hasHold: false, requiresSafety: false },
            { id: 106, name: '平板式呼吸', desc: '穩定核心中平穩呼吸', type: 'plank', hasHold: false, requiresSafety: false },
            { id: 107, name: '深蹲呼吸', desc: '下蹲吸氣，起身吐氣', type: 'squat', hasHold: false, requiresSafety: false },
            { id: 108, name: '吸氣後屏息', desc: '吸飽氣後捏鼻計時', type: 'hold_in', hasHold: true, requiresSafety: true },
            { id: 109, name: '吐氣後屏息', desc: '吐盡氣後捏鼻計時', type: 'hold_out', hasHold: true, requiresSafety: true },
            { id: 110, name: '吸管呼吸', desc: '用吸管增加阻力', type: 'straw', hasHold: false, requiresSafety: false },
            { id: 111, name: '吹氣球練習', desc: '一口氣慢慢吹氣球', type: 'balloon', hasHold: false, requiresSafety: false },
            { id: 112, name: '工作時深呼吸', desc: '每小時提醒', type: 'work', hasHold: false, requiresSafety: false },
            { id: 113, name: '跑步呼吸法', desc: '三步一吸、兩步一吐', type: 'running', hasHold: false, requiresSafety: false },
            { id: 114, name: '重量訓練呼吸', desc: '用力時吐氣', type: 'weight', hasHold: false, requiresSafety: false },
            { id: 115, name: '睡前放鬆組合', desc: '4-7-8四次+左側臥', type: 'sleep', hasHold: true, requiresSafety: false }
        ];

        const allPractices = [...basicPractices, ...advancedPractices];

        // ==================== 一次性密碼驗證 (Supabase版) ====================
        async function verifyPassword() {
            const code = document.getElementById('unlockPassword').value.trim();
            if (!code) return;

            // 1. 查詢有沒有這組密碼且 is_used = false
            const { data, error } = await supabase
                .from('breathing_otps')
                .select('id')
                .eq('code', code)
                .eq('is_used', false)
                .maybeSingle();

            if (error || !data) {
                alert('❌ 密碼無效或已經被使用過了！');
                return;
            }

            // 2. 把這組密碼標記為已使用
            const { error: updateError } = await supabase
                .from('breathing_otps')
                .update({ is_used: true })
                .eq('id', data.id);

            if (updateError) {
                console.error(updateError);
                alert('伺服器錯誤，請稍後再試');
                return;
            }

            // 3. 解鎖成功
            state.advancedUnlocked = true;
            localStorage.setItem('advanced_unlocked', 'true');
            closeModal();
            showAdvancedSection();
            alert('✅ 解鎖成功！現在可以使用進階練習了。');
        }

        function closeModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function showPasswordModal() {
            if (state.advancedUnlocked) {
                showAdvancedSection();
                return;
            }
            document.getElementById('passwordModal').style.display = 'flex';
        }

        function showAdvancedSection() {
            document.getElementById('advancedSection').style.display = 'block';
            document.getElementById('unlockButtonContainer').style.display = 'none';
            renderAdvancedList();
        }

        // ==================== 渲染列表 ====================
        function renderBasicList() {
            const container = document.getElementById('basicPracticeList');
            container.innerHTML = basicPractices.map(p => `
                <div class="practice-card" onclick="selectPractice(${p.id})">
                    <h3>${p.name}</h3>
                    <p>${p.desc}</p>
                </div>
            `).join('');
        }

        function renderAdvancedList() {
            const container = document.getElementById('advancedPracticeList');
            if (!state.advancedUnlocked) {
                container.innerHTML = advancedPractices.map(p => `
                    <div class="practice-card locked" onclick="alert('請先解鎖進階練習')">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = advancedPractices.map(p => `
                    <div class="practice-card" onclick="selectPractice(${p.id})">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                `).join('');
            }
        }

        // ==================== 練習選擇與控制 ====================
        function selectPractice(id) {
            state.sel = allPractices.find(p => p.id === id);
            document.querySelectorAll('.practice-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');

            document.getElementById('controlPanel').style.display = 'block';

            if (state.sel.requiresSafety) {
                document.getElementById('safetyWarning').style.display = 'block';
                state.safetyAcknowledged = false;
            } else {
                document.getElementById('safetyWarning').style.display = 'none';
                state.safetyAcknowledged = true;
            }

            if (state.sel.levels) {
                setLevel(state.level);
            } else {
                state.in = 4; state.ex = 6;
                updateSliderUI();
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = `開始「${state.sel.name}」`;
        }

        function setLevel(lv) {
            state.level = lv;
            document.querySelectorAll('.btn-level').forEach(b => {
                b.classList.toggle('active', b.innerText === (lv==='simple'?'簡單':lv==='advanced'?'進階':'高階'));
            });
            if (state.sel && state.sel.levels) {
                const vals = state.sel.levels[lv];
                state.in = vals[0];
                state.ex = vals[1];
                updateSliderUI();
            }
        }

        function updateSliderUI() {
            document.getElementById('rangeIn').value = state.in;
            document.getElementById('rangeEx').value = state.ex;
            document.getElementById('txtIn').innerText = state.in + 's';
            document.getElementById('txtEx').innerText = state.ex + 's';
        }

        document.getElementById('rangeIn').oninput = (e) => {
            state.in = parseInt(e.target.value);
            if (state.sel && state.sel.type === 'ratio_12') {
                state.ex = state.in * 2;
            }
            updateSliderUI();
        };
        document.getElementById('rangeEx').oninput = (e) => {
            state.ex = parseInt(e.target.value);
            updateSliderUI();
        };

        // ==================== 訓練核心 ====================
        function startSession() {
            if (state.sel.requiresSafety && !state.safetyAcknowledged) {
                if (!confirm('⚠️ 此練習有安全風險，請確定身體狀況允許。')) return;
                state.safetyAcknowledged = true;
            }

            showPage('training');
            state.isRun = true;
            state.sec = 0; state.pSec = 0; state.cycles = 0; state.phase = 'in';
            state.phaseQueue = []; state.phaseIndex = 0;

            document.getElementById('curTitle').innerText = state.sel.name;
            document.getElementById('circle').className = 'breath-circle' + (state.sel.type === 'belly' ? ' belly-mode' : '');

            initPhaseQueue();
            runCycle();
            state.timer = setInterval(tick, 1000);
        }

        function initPhaseQueue() {
            const type = state.sel.type;
            if (type === 'segmented_in') {
                state.phaseQueue = [
                    { name: '吸氣', duration: 2, action: 'inhale' },
                    { name: 'hold', duration: 2, action: 'hold' },
                    { name: '吸氣', duration: 2, action: 'inhale' },
                    { name: 'hold', duration: 2, action: 'hold' },
                    { name: '吸氣', duration: 2, action: 'inhale' },
                    { name: '吐氣', duration: 6, action: 'exhale' }
                ];
            } else if (type === 'segmented_out') {
                state.phaseQueue = [
                    { name: '吐氣', duration: 2, action: 'exhale' },
                    { name: 'hold', duration: 2, action: 'hold' },
                    { name: '吐氣', duration: 2, action: 'exhale' },
                    { name: 'hold', duration: 2, action: 'hold' },
                    { name: '吐氣', duration: 2, action: 'exhale' },
                    { name: 'hold', duration: 2, action: 'hold' }
                ];
            } else if (type === '478') {
                state.phaseQueue = [
                    { name: '吸氣', duration: 4, action: 'inhale' },
                    { name: 'hold', duration: 7, action: 'hold' },
                    { name: '吐氣', duration: 8, action: 'exhale' }
                ];
            } else if (type === 'extend_exhale') {
                state.phaseQueue = [
                    { name: '吸氣', duration: 4, action: 'inhale' },
                    { name: '吐氣', duration: state.ex, action: 'exhale' }
                ];
            } else if (type === 'hold_in') {
                state.phaseQueue = [
                    { name: '吸氣', duration: state.in, action: 'inhale' },
                    { name: 'hold', duration: 0, action: 'hold' }
                ];
            } else if (type === 'hold_out') {
                state.phaseQueue = [
                    { name: '吐氣', duration: state.ex, action: 'exhale' },
                    { name: 'hold', duration: 0, action: 'hold' }
                ];
            } else if (type === 'deadbug') {
                state.phaseQueue = [
                    { name: '吸氣準備', duration: state.in, action: 'inhale' },
                    { name: '吐氣收核心', duration: state.ex, action: 'exhale' }
                ];
            } else if (type === 'plank') {
                state.phaseQueue = [
                    { name: '穩定吸氣', duration: state.in, action: 'inhale' },
                    { name: '穩定吐氣', duration: state.ex, action: 'exhale' }
                ];
            } else if (type === 'squat') {
                state.phaseQueue = [
                    { name: '下蹲吸氣', duration: state.in, action: 'inhale' },
                    { name: '起身吐氣', duration: state.ex, action: 'exhale' }
                ];
            } else if (type === 'straw') {
                state.phaseQueue = [ { name: '用吸管呼吸', duration: 180, action: 'none' } ];
            } else if (type === 'balloon') {
                state.phaseQueue = [ { name: '一口氣吹氣球', duration: 0, action: 'none' } ];
            } else if (type === 'work') {
                state.phaseQueue = [ { name: '深呼吸', duration: 3, action: 'inhale' }, { name: '吐氣', duration: 6, action: 'exhale' } ];
            } else if (type === 'running') {
                state.phaseQueue = [
                    { name: '吸', duration: 1, action: 'inhale' },
                    { name: '吸', duration: 1, action: 'inhale' },
                    { name: '吸', duration: 1, action: 'inhale' },
                    { name: '吐', duration: 1, action: 'exhale' },
                    { name: '吐', duration: 1, action: 'exhale' }
                ];
            } else if (type === 'weight') {
                state.phaseQueue = [
                    { name: '準備吸氣', duration: state.in, action: 'inhale' },
                    { name: '用力吐氣', duration: state.ex, action: 'exhale' }
                ];
            } else if (type === 'sleep') {
                state.phaseQueue = [
                    { name: '吸氣', duration: 4, action: 'inhale' },
                    { name: 'hold', duration: 7, action: 'hold' },
                    { name: '吐氣', duration: 8, action: 'exhale' }
                ];
                state.sleepRepeat = 4;
            } else {
                state.phaseQueue = [
                    { name: '吸氣', duration: state.in, action: 'inhale' },
                    { name: '吐氣', duration: state.ex, action: 'exhale' }
                ];
            }
            state.totalPhases = state.phaseQueue.length;
            state.phaseIndex = 0;
        }

        function tick() {
            state.sec++;
            state.pSec++;

            const phase = state.phaseQueue[state.phaseIndex];
            if (!phase) return;

            const target = phase.duration;
            if (target > 0) {
                document.getElementById('timerTxt').innerText = Math.max(0, target - state.pSec);
            } else {
                document.getElementById('timerTxt').innerText = state.pSec;
            }

            const m = Math.floor(state.sec / 60);
            const s = state.sec % 60;
            document.getElementById('statTime').innerText = `${m}:${s.toString().padStart(2, '0')}`;

            if (target > 0 && state.pSec >= target) {
                state.pSec = 0;
                state.phaseIndex++;
                if (state.phaseIndex >= state.totalPhases) {
                    if (state.sel.type === 'sleep' && state.sleepRepeat > 1) {
                        state.sleepRepeat--;
                        state.phaseIndex = 0;
                    } else {
                        state.cycles++;
                        document.getElementById('statCycles').innerText = state.cycles;
                        state.phaseIndex = 0;
                    }
                }
                runCycle();
            }
        }

        function runCycle() {
            if (state.phaseIndex >= state.totalPhases) state.phaseIndex = 0;
            const phase = state.phaseQueue[state.phaseIndex];
            if (!phase) return;

            const circle = document.getElementById('circle');
            const txt = document.getElementById('phaseTxt');
            txt.innerText = phase.name;

            if (phase.action === 'inhale') {
                circle.style.transition = `transform ${phase.duration}s linear`;
                circle.style.transform = 'scale(1.5)';
            } else if (phase.action === 'exhale') {
                circle.style.transition = `transform ${phase.duration}s linear`;
                circle.style.transform = 'scale(0.8)';
            } else if (phase.action === 'hold') {
                circle.style.transition = 'none';
            }
            if (phase.duration > 0) {
                document.getElementById('timerTxt').innerText = phase.duration;
            } else {
                document.getElementById('timerTxt').innerText = '0';
            }
        }

        async function stopSession() {
            clearInterval(state.timer);
            const record = {
                practice_name: state.sel.name,
                duration_seconds: state.sec,
                cycles: state.cycles,
                notes: `吸${state.in}/吐${state.ex} (${state.level})`,
                created_at: new Date().toISOString()
            };
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]');
            logs.unshift(record);
            localStorage.setItem('breath_logs_v2', JSON.stringify(logs.slice(0, 50)));
            await supabase.from('practice_records').insert([record]);
            alert('練習完成！');
            showPage('home');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(id));
            });
            if (id === 'records') loadLogs();
            if (id === 'stats') renderChart();
        }

        function loadLogs() {
            const container = document.getElementById('logContainer');
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]');
            if (!logs.length) {
                container.innerHTML = '<p style="text-align:center; opacity:0.5;">尚無紀錄</p>';
                return;
            }
            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <div>
                        <div style="font-weight:bold">${l.practice_name}</div>
                        <small style="opacity:0.6">${new Date(l.created_at).toLocaleDateString()} · ${l.notes}</small>
                    </div>
                    <div style="text-align:right">
                        <div style="color:var(--primary-gold)">${l.cycles} 回</div>
                        <small>${Math.floor(l.duration_seconds/60)}分${l.duration_seconds%60}秒</small>
                    </div>
                </div>
            `).join('');
        }

        let myChart = null;
        function renderChart() {
            const ctx = document.getElementById('statChart').getContext('2d');
            const logs = JSON.parse(localStorage.getItem('breath_logs_v2') || '[]').reverse();
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => new Date(l.created_at).getDate() + '日'),
                    datasets: [{
                        label: '練習循環數',
                        data: logs.map(l => l.cycles),
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255, 215, 0, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }

        window.onload = () => {
            renderBasicList();
            renderAdvancedList();
            if (state.advancedUnlocked) showAdvancedSection();
        };
    </script>
</body>
</html>
