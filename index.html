<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸練習 · 我的訓練日記</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; }
        .nav-bar { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); padding: 10px; }
        .nav-btn { background: none; border: none; color: white; font-size: 1rem; padding: 10px; cursor: pointer; border-radius: 8px; }
        .nav-btn.active { background: rgba(255,255,255,0.2); }
        .page { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .container { max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .practice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .practice-card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .practice-card.selected { border-color: #ffd700; background: rgba(255,255,255,0.2); }
        .slider-group { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .btn-primary { background: #ffd700; color: #333; }
        .btn-danger { background: #ff4757; color: white; }
        .breathing-circle { width: 180px; height: 180px; margin: 40px auto; border-radius: 50%; background: radial-gradient(circle, #ffd700, #ffa500); transition: transform 1s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .record-item { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home')">🏠 練習</button>
        <button class="nav-btn" onclick="showPage('records')">📊 紀錄</button>
        <button class="nav-btn" onclick="showPage('stats')">📈 統計</button>
    </div>

    <div id="home" class="page active">
        <div class="container">
            <h1 style="text-align:center">🌬️ 呼吸練習</h1>
            <div class="practice-grid" id="practiceGrid"></div>
            <div id="settingsPanel" style="display:none">
                <div class="slider-group">
                    <span>吸氣: <span id="v_inhale">4</span>s</span>
                    <input type="range" id="s_inhale" min="2" max="15" value="4" style="width:100%">
                </div>
                <div class="slider-group">
                    <span>吐氣: <span id="v_exhale">6</span>s</span>
                    <input type="range" id="s_exhale" min="2" max="20" value="6" style="width:100%">
                </div>
            </div>
            <button class="btn btn-primary" id="startBtn" onclick="startPractice()" disabled>請選擇模式</button>
        </div>
    </div>

    <div id="practice" class="page">
        <div class="container" style="text-align:center">
            <h2 id="curName">練習中</h2>
            <div class="breathing-circle" id="circle"><b id="phaseTxt" style="color:#333; font-size:1.5rem">準備</b></div>
            <h2 id="countDown">3</h2>
            <div style="display:flex; justify-content: space-around; margin-top:20px">
                <div><h3 id="c_cycle">0</h3>次</div>
                <div><h3 id="c_time">0:00</h3>時間</div>
            </div>
            <button class="btn btn-danger" onclick="stopPractice()">結束並儲存</button>
        </div>
    </div>

    <div id="records" class="page">
        <div class="container">
            <h2>📋 歷史紀錄</h2>
            <div id="recordsList" style="margin-top:15px"></div>
        </div>
    </div>

    <div id="stats" class="page">
        <div class="container">
            <h2>📈 進步趨勢</h2>
            <canvas id="pChart" style="height:250px; margin-top:20px"></canvas>
        </div>
    </div>

    <script>
        // --- 修正重複宣告問題：使用全域 window 物件檢查 ---
        const CONFIG = {
            URL: 'https://fayorxvfxtrycjiiiyfu.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZheW9yeHZmeHRyeWNqaWlpeWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNzY1MTAsImV4cCI6MjA3OTg1MjUxMH0.7znE_AaNg6zESUO-RoSsyFqxCgcxjPT_pQiN557e6Nw'
        };

        // 如果 db 已經存在就不要重新宣告，改名為 db 以防跟庫名稱衝突
        if (typeof window.db === 'undefined') {
            window.db = window.supabase ? window.supabase.createClient(CONFIG.URL, CONFIG.KEY) : null;
        }

        const data = [
            { id: 1, name: '腹式呼吸', icon: '🌙', in: 4, ex: 6 },
            { id: 2, name: '1:2 呼吸', icon: '💆', in: 3, ex: 6 },
            { id: 3, name: '能量呼吸', icon: '👃', in: 5, ex: 5 },
            { id: 4, name: '長效吐氣', icon: '⬇️', in: 4, ex: 8 }
        ];

        let state = { sel: null, in: 4, ex: 6, isRun: false, sec: 0, pSec: 0, phase: 'in', cycles: 0, timer: null };
        let chart = null;

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('practiceGrid');
            grid.innerHTML = data.map(p => `
                <div class="practice-card" onclick="select(${p.id})">
                    <div style="font-size:2rem">${p.icon}</div>
                    <b>${p.name}</b>
                </div>
            `).join('');

            document.getElementById('s_inhale').oninput = e => { state.in = +e.target.value; document.getElementById('v_inhale').innerText = state.in; };
            document.getElementById('s_exhale').oninput = e => { state.ex = +e.target.value; document.getElementById('v_exhale').innerText = state.ex; };
        });

        function select(id) {
            state.sel = data.find(p => p.id === id);
            state.in = state.sel.in;
            state.ex = state.sel.ex;
            document.querySelectorAll('.practice-card').forEach((c, i) => c.classList.toggle('selected', (i+1)===id));
            document.getElementById('settingsPanel').style.display = 'block';
            document.getElementById('s_inhale').value = state.in;
            document.getElementById('s_exhale').value = state.ex;
            document.getElementById('v_inhale').innerText = state.in;
            document.getElementById('v_exhale').innerText = state.ex;
            const btn = document.getElementById('startBtn');
            btn.disabled = false;
            btn.innerText = '▶️ 開始' + state.sel.name;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(id)));
            if(id === 'records') loadLogs();
            if(id === 'stats') renderChart();
        }

        function startPractice() {
            showPage('practice');
            state.isRun = true; state.sec = 0; state.pSec = 0; state.phase = 'in'; state.cycles = 0;
            document.getElementById('curName').innerText = state.sel.name;
            updateUI();
            if(state.timer) clearInterval(state.timer);
            state.timer = setInterval(tick, 1000);
        }

        function tick() {
            state.sec++; state.pSec++;
            const target = state.phase === 'in' ? state.in : state.ex;
            document.getElementById('countDown').innerText = Math.max(0, target - state.pSec);
            document.getElementById('c_time').innerText = Math.floor(state.sec/60) + ':' + (state.sec%60).toString().padStart(2,'0');

            if(state.pSec >= target) {
                state.pSec = 0;
                if(state.phase === 'in') {
                    state.phase = 'ex';
                } else {
                    state.phase = 'in';
                    state.cycles++;
                    document.getElementById('c_cycle').innerText = state.cycles;
                }
                updateUI();
            }
        }

        function updateUI() {
            const c = document.getElementById('circle');
            const t = document.getElementById('phaseTxt');
            if(state.phase === 'in') { t.innerText = '吸氣'; c.style.transform = 'scale(1.4)'; }
            else { t.innerText = '吐氣'; c.style.transform = 'scale(0.8)'; }
        }

        async function stopPractice() {
            clearInterval(state.timer);
            const record = { practice_name: state.sel.name, duration_seconds: state.sec, cycles: state.cycles, notes: `吸${state.in}/吐${state.ex}`, created_at: new Date().toISOString() };
            const local = JSON.parse(localStorage.getItem('logs') || '[]');
            local.unshift(record);
            localStorage.setItem('logs', JSON.stringify(local.slice(0,50)));
            if(window.db) await window.db.from('practice_records').insert([record]);
            alert('練習完成！');
            showPage('home');
        }

        function loadLogs() {
            const list = document.getElementById('recordsList');
            const logs = JSON.parse(localStorage.getItem('logs') || '[]');
            list.innerHTML = logs.length ? logs.map(l => `
                <div class="record-item">
                    <div><b>${l.practice_name}</b><br><small>${l.notes}</small></div>
                    <div style="text-align:right"><b>${l.cycles}回</b><br><small>${Math.floor(l.duration_seconds/60)}分</small></div>
                </div>
            `).join('') : '<p style="text-align:center">暫無紀錄</p>';
        }

        function renderChart() {
            const ctx = document.getElementById('pChart').getContext('2d');
            const logs = JSON.parse(localStorage.getItem('logs') || '[]').reverse();
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => new Date(l.created_at).getDate() + '日'),
                    datasets: [{ label: '練習次數', data: logs.map(l => l.cycles), borderColor: '#ffd700', tension: 0.3 }]
                },
                options: { scales: { y: { ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } }
            });
        }
    </script>
</body>
</html>
