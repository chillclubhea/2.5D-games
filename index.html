<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸練習 · 我的訓練日記</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        /* 頁面切換 */
        .page {
            display: none;
            padding: 20px;
            min-height: 100vh;
        }
        .page.active { display: block; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        h1 { font-size: 2rem; margin-bottom: 10px; }
        h2 { font-size: 1.5rem; margin: 20px 0 10px; }
        
        /* 練習卡片選單 */
        .practice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .practice-card {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .practice-card:hover { transform: scale(1.02); }
        .practice-card.selected {
            border-color: #ffd700;
            background: rgba(255,255,255,0.25);
        }
        .practice-icon { font-size: 2rem; display: block; margin-bottom: 5px; }
        .practice-name { font-weight: bold; }
        .practice-desc { font-size: 0.8rem; opacity: 0.8; }

        /* 秒數調整滑桿 */
        .slider-group {
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        input[type=range] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: rgba(255,255,255,0.3);
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 按鈕 */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #ffd700; color: #333; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: white; }
        .btn-danger { background: #ff4757; color: white; }

        /* 呼吸動畫 */
        .breathing-circle {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700, #ffa500);
            transition: transform 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }
        .phase-text {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .timer-big {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        /* 記錄列表 */
        .record-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        /* 目標設定 */
        .goal-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #ffd700;
            border-radius: 5px;
            width: 0%;
        }

        /* 圖表容器 */
        .chart-container {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            height: 300px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .nav-btn.active {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <!-- 導航列 -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showPage('home')">🏠 練習</button>
        <button class="nav-btn" onclick="showPage('records')">📊 紀錄</button>
        <button class="nav-btn" onclick="showPage('goals')">🎯 目標</button>
        <button class="nav-btn" onclick="showPage('stats')">📈 統計</button>
    </div>

    <!-- 首頁：練習選擇 -->
    <div id="home" class="page active">
        <div class="container">
            <h1>🌬️ 我的呼吸練習</h1>
            <p>今天想練習哪一種？</p>

            <div class="practice-grid" id="practiceGrid">
                <!-- 6種練習會用JS動態產生 -->
            </div>

            <div id="settingsPanel" style="display: none;">
                <h2>⚙️ 調整秒數</h2>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>吸氣時間</span>
                        <span id="inhaleValue">4 秒</span>
                    </div>
                    <input type="range" id="inhaleSlider" min="2" max="15" value="4" step="1">
                </div>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>吐氣時間</span>
                        <span id="exhaleValue">6 秒</span>
                    </div>
                    <input type="range" id="exhaleSlider" min="2" max="20" value="6" step="1">
                </div>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>練習分鐘數</span>
                        <span id="minutesValue">5 分鐘</span>
                    </div>
                    <input type="range" id="minutesSlider" min="1" max="30" value="5" step="1">
                </div>
            </div>

            <button class="btn btn-primary" onclick="startPractice()" id="startBtn" disabled>▶️ 開始練習</button>
        </div>
    </div>

    <!-- 練習進行頁 -->
    <div id="practice" class="page">
        <div class="container" style="text-align: center;">
            <h2 id="practiceName">腹式呼吸</h2>
            
            <div class="breathing-circle" id="breathCircle">
                <div class="phase-text" id="phaseText">準備</div>
            </div>
            
            <div class="timer-big" id="timer">3</div>
            
            <div style="display: flex; justify-content: space-around; margin: 20px 0;">
                <div>
                    <div style="font-size: 1.5rem;" id="cycleCount">0</div>
                    <div>循環</div>
                </div>
                <div>
                    <div style="font-size: 1.5rem;" id="timeCount">0:00</div>
                    <div>時間</div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="stopPractice()">⏹️ 結束練習</button>
            <button class="btn btn-secondary" onclick="pausePractice()" id="pauseBtn">⏸️ 暫停</button>
        </div>
    </div>

    <!-- 記錄頁 -->
    <div id="records" class="page">
        <div class="container">
            <h2>📋 練習記錄</h2>
            <div id="recordsList"></div>
            <button class="btn btn-secondary" onclick="showPage('home')">返回</button>
        </div>
    </div>

    <!-- 目標頁 -->
    <div id="goals" class="page">
        <div class="container">
            <h2>🎯 我的目標</h2>
            
            <div class="goal-item">
                <h3>設定新目標</h3>
                <select id="goalType" style="width:100%; padding:10px; margin:10px 0;">
                    <option value="days">連續練習天數</option>
                    <option value="cycles">每日練習循環數</option>
                    <option value="inhale">吸氣最長秒數</option>
                    <option value="exhale">吐氣最長秒數</option>
                </select>
                <input type="number" id="goalValue" placeholder="目標數值" style="width:100%; padding:10px; margin:10px 0;">
                <button class="btn btn-primary" onclick="addGoal()">設定目標</button>
            </div>

            <div id="goalsList"></div>
            <button class="btn btn-secondary" onclick="showPage('home')">返回</button>
        </div>
    </div>

    <!-- 統計頁 -->
    <div id="stats" class="page">
        <div class="container">
            <h2>📈 進步曲線</h2>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
            <div style="text-align: center; margin: 20px 0;">
                <button onclick="changeChartType('cycles')" class="btn btn-secondary" style="width: auto; padding: 5px 15px;">練習次數</button>
                <button onclick="changeChartType('time')" class="btn btn-secondary" style="width: auto; padding: 5px 15px;">練習時間</button>
            </div>
            <button class="btn btn-secondary" onclick="showPage('home')">返回</button>
        </div>
    </div>

    <script>
        // ==================== Supabase 設定 ====================
        const SUPABASE_URL = 'https://sdloakutxcsbshcqpxwn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbG9ha3V0eGNzYnNoY3FweHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxMTE4MjYsImV4cCI6MjA4MTY4NzgyNn0.5OBQQAinARnZQ6VSCrPl60NWmcSG-QiFMmVIJRW7g-0';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==================== 練習資料 ====================
        const practices = [
            { 
                id: 1, 
                name: '腹式呼吸', 
                icon: '🌙', 
                desc: '基礎放鬆練習',
                defaultInhale: 4,
                defaultExhale: 6,
                instruction: '躺平，手放腹部。吸氣時腹部鼓起，吐氣時腹部收回'
            },
            { 
                id: 2, 
                name: '3D腹式呼吸', 
                icon: '🌍', 
                desc: '腹部全方位擴張',
                defaultInhale: 4,
                defaultExhale: 6,
                instruction: '吸氣時腹部向前、向兩側、向後同時擴張'
            },
            { 
                id: 3, 
                name: '吸氣訓練', 
                icon: '⬆️', 
                desc: '目標4→6→8→10秒',
                defaultInhale: 4,
                defaultExhale: 4,
                instruction: '專注拉長吸氣，慢慢增加秒數'
            },
            { 
                id: 4, 
                name: '吐氣訓練', 
                icon: '⬇️', 
                desc: '目標6→8→10→12秒',
                defaultInhale: 4,
                defaultExhale: 6,
                instruction: '專注拉長吐氣，慢慢增加秒數'
            },
            { 
                id: 5, 
                name: '1:2呼吸法', 
                icon: '💆', 
                desc: '情緒急救包（吸3吐6）',
                defaultInhale: 3,
                defaultExhale: 6,
                instruction: '吐氣時間是吸氣的2倍，幫助放鬆'
            },
            { 
                id: 6, 
                name: '單鼻吸氣', 
                icon: '👃', 
                desc: '右鼻能量/左鼻放鬆',
                defaultInhale: 4,
                defaultExhale: 4,
                instruction: '右鼻：提升能量；左鼻：幫助放鬆'
            }
        ];

        // ==================== 狀態管理 ====================
        let currentState = {
            selectedPractice: null,
            inhaleTime: 4,
            exhaleTime: 6,
            practiceMinutes: 5,
            isPracticing: false,
            isPaused: false,
            currentPhase: 'inhale',
            cycles: 0,
            totalSeconds: 0,
            timer: null
        };

        // ==================== 顯示練習卡片 ====================
        function renderPracticeGrid() {
            const grid = document.getElementById('practiceGrid');
            grid.innerHTML = '';
            
            practices.forEach(p => {
                const card = document.createElement('div');
                card.className = 'practice-card';
                card.onclick = () => selectPractice(p.id);
                card.innerHTML = `
                    <span class="practice-icon">${p.icon}</span>
                    <div class="practice-name">${p.name}</div>
                    <div class="practice-desc">${p.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        // ==================== 選擇練習 ====================
        function selectPractice(id) {
            // 移除所有選中效果
            document.querySelectorAll('.practice-card').forEach(c => c.classList.remove('selected'));
            
            // 選中當前卡片
            const selectedCard = document.querySelectorAll('.practice-card')[id-1];
            selectedCard.classList.add('selected');
            
            // 更新狀態
            currentState.selectedPractice = practices.find(p => p.id === id);
            currentState.inhaleTime = currentState.selectedPractice.defaultInhale;
            currentState.exhaleTime = currentState.selectedPractice.defaultExhale;
            
            // 顯示設定面板
            document.getElementById('settingsPanel').style.display = 'block';
            
            // 更新滑桿數值
            document.getElementById('inhaleSlider').value = currentState.inhaleTime;
            document.getElementById('exhaleSlider').value = currentState.exhaleTime;
            document.getElementById('inhaleValue').textContent = currentState.inhaleTime + ' 秒';
            document.getElementById('exhaleValue').textContent = currentState.exhaleTime + ' 秒';
            
            // 啟用開始按鈕
            document.getElementById('startBtn').disabled = false;
        }

        // ==================== 滑桿事件 ====================
        document.getElementById('inhaleSlider').oninput = function(e) {
            currentState.inhaleTime = parseInt(e.target.value);
            document.getElementById('inhaleValue').textContent = currentState.inhaleTime + ' 秒';
        };

        document.getElementById('exhaleSlider').oninput = function(e) {
            currentState.exhaleTime = parseInt(e.target.value);
            document.getElementById('exhaleValue').textContent = currentState.exhaleTime + ' 秒';
        };

        document.getElementById('minutesSlider').oninput = function(e) {
            currentState.practiceMinutes = parseInt(e.target.value);
            document.getElementById('minutesValue').textContent = currentState.practiceMinutes + ' 分鐘';
        };

        // ==================== 開始練習 ====================
        function startPractice() {
            showPage('practice');
            document.getElementById('practiceName').textContent = currentState.selectedPractice.name;
            
            // 重置狀態
            currentState.isPracticing = true;
            currentState.isPaused = false;
            currentState.cycles = 0;
            currentState.totalSeconds = 0;
            currentState.currentPhase = 'inhale';
            
            document.getElementById('cycleCount').textContent = '0';
            document.getElementById('timeCount').textContent = '0:00';
            document.getElementById('pauseBtn').textContent = '⏸️ 暫停';
            
            // 設定呼吸動畫
            updateBreathPhase();
            
            // 開始計時器
            startTimer();
        }

        // ==================== 呼吸計時器 ====================
        let phaseSeconds = 0;
        let totalSeconds = 0;
        
        function startTimer() {
            phaseSeconds = 0;
            totalSeconds = 0;
            
            currentState.timer = setInterval(() => {
                if (!currentState.isPracticing || currentState.isPaused) return;
                
                const targetTime = currentState.currentPhase === 'inhale' ? 
                    currentState.inhaleTime : currentState.exhaleTime;
                
                phaseSeconds++;
                totalSeconds++;
                
                // 更新顯示
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                document.getElementById('timeCount').textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
                document.getElementById('timer').textContent = targetTime - phaseSeconds + 1;
                
                // 檢查是否切換階段
                if (phaseSeconds >= targetTime) {
                    phaseSeconds = 0;
                    
                    if (currentState.currentPhase === 'inhale') {
                        currentState.currentPhase = 'exhale';
                    } else {
                        currentState.currentPhase = 'inhale';
                        currentState.cycles++;
                        document.getElementById('cycleCount').textContent = currentState.cycles;
                    }
                    
                    updateBreathPhase();
                }
                
                // 檢查是否達到設定時間
                if (totalSeconds >= currentState.practiceMinutes * 60) {
                    stopPractice();
                }
                
            }, 1000);
        }

        // ==================== 更新呼吸視覺 ====================
        function updateBreathPhase() {
            const circle = document.getElementById('breathCircle');
            const phaseText = document.getElementById('phaseText');
            const timer = document.getElementById('timer');
            
            if (currentState.currentPhase === 'inhale') {
                phaseText.textContent = '吸氣';
                circle.style.transform = 'scale(1.5)';
                timer.textContent = currentState.inhaleTime;
            } else {
                phaseText.textContent = '吐氣';
                circle.style.transform = 'scale(1)';
                timer.textContent = currentState.exhaleTime;
            }
        }

        // ==================== 暫停練習 ====================
        function pausePractice() {
            currentState.isPaused = !currentState.isPaused;
            document.getElementById('pauseBtn').textContent = 
                currentState.isPaused ? '▶️ 繼續' : '⏸️ 暫停';
        }

        // ==================== 結束練習 ====================
        async function stopPractice() {
            clearInterval(currentState.timer);
            currentState.isPracticing = false;
            
            // 如果有完成至少1個循環，儲存記錄
            if (currentState.cycles > 0) {
                await saveRecord();
            }
            
            showPage('home');
        }

        // ==================== 儲存記錄到 Supabase ====================
        async function saveRecord() {
            const record = {
                practice_name: currentState.selectedPractice.name,
                duration_seconds: currentState.totalSeconds,
                cycles: currentState.cycles,
                notes: `吸${currentState.inhaleTime}秒/呼${currentState.exhaleTime}秒`,
                created_at: new Date().toISOString()
            };
            
            // 儲存到 Supabase
            const { error } = await supabase
                .from('practice_records')
                .insert([record]);
            
            if (error) {
                console.error('儲存失敗:', error);
                alert('儲存失敗，但練習已完成！');
            } else {
                alert('✅ 練習記錄已儲存！');
            }
            
            // 同時存到 localStorage 備份
            const localRecords = JSON.parse(localStorage.getItem('my_practice_records') || '[]');
            localRecords.unshift(record);
            localStorage.setItem('my_practice_records', JSON.stringify(localRecords.slice(0, 50)));
        }

        // ==================== 顯示記錄 ====================
        async function loadRecords() {
            const list = document.getElementById('recordsList');
            list.innerHTML = '載入中...';
            
            // 從 Supabase 讀取
            const { data, error } = await supabase
                .from('practice_records')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(20);
            
            let records = data;
            
            // 如果沒有雲端資料，用本地的
            if (!records || records.length === 0) {
                records = JSON.parse(localStorage.getItem('my_practice_records') || '[]');
            }
            
            if (records.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:20px;">還沒有練習記錄喔！</div>';
                return;
            }
            
            list.innerHTML = '';
            records.forEach(r => {
                const date = new Date(r.created_at).toLocaleString('zh-TW', {
                    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                const div = document.createElement('div');
                div.className = 'record-item';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${r.practice_name}</div>
                        <div style="font-size:0.8rem; opacity:0.7;">${date}</div>
                        <div style="font-size:0.8rem;">${r.notes || ''}</div>
                    </div>
                    <div style="text-align:right;">
                        <div>${r.cycles} 循環</div>
                        <div style="font-size:0.8rem;">${Math.floor(r.duration_seconds/60)}分${r.duration_seconds%60}秒</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // ==================== 目標設定 ====================
        async function addGoal() {
            const type = document.getElementById('goalType').value;
            const value = document.getElementById('goalValue').value;
            
            if (!value) {
                alert('請輸入目標數值！');
                return;
            }
            
            const goal = {
                goal_type: type,
                target_value: parseInt(value),
                current_progress: 0,
                start_date: new Date().toISOString().split('T')[0],
                is_completed: false
            };
            
            const { error } = await supabase
                .from('user_goals')
                .insert([goal]);
            
            if (error) {
                console.error('目標設定失敗:', error);
                alert('設定失敗，請稍後再試');
            } else {
                alert('✅ 目標設定成功！');
                loadGoals();
            }
        }

        async function loadGoals() {
            const list = document.getElementById('goalsList');
            
            const { data, error } = await supabase
                .from('user_goals')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error || !data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:20px;">還沒有設定目標</div>';
                return;
            }
            
            list.innerHTML = '';
            data.forEach(g => {
                const progress = (g.current_progress / g.target_value * 100) || 0;
                
                const div = document.createElement('div');
                div.className = 'goal-item';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span>${getGoalName(g.goal_type)}</span>
                        <span>${g.current_progress}/${g.target_value}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%;"></div>
                    </div>
                    ${g.is_completed ? '<span style="color:#ffd700;">✅ 已完成！</span>' : ''}
                `;
                list.appendChild(div);
            });
        }

        function getGoalName(type) {
            const names = {
                'days': '連續練習天數',
                'cycles': '每日練習循環數',
                'inhale': '吸氣最長秒數',
                'exhale': '吐氣最長秒數'
            };
            return names[type] || type;
        }

        // ==================== 統計圖表 ====================
        let chartType = 'cycles';
        let myChart;

        async function loadChart() {
            const { data, error } = await supabase
                .from('practice_records')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(30);
            
            let records = data;
            if (!records || records.length === 0) {
                records = JSON.parse(localStorage.getItem('my_practice_records') || '[]').reverse();
            }
            
            const labels = records.map(r => {
                const d = new Date(r.created_at);
                return `${d.getMonth()+1}/${d.getDate()}`;
            });
            
            const values = records.map(r => chartType === 'cycles' ? r.cycles : Math.floor(r.duration_seconds/60));
            
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartType === 'cycles' ? '練習次數' : '練習分鐘',
                        data: values,
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255,215,0,0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: 'white' } },
                        x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: 'white' } }
                    }
                }
            });
        }

        function changeChartType(type) {
            chartType = type;
            loadChart();
        }

        // ==================== 頁面切換 ====================
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            // 根據不同頁面載入資料
            if (page === 'records') loadRecords();
            if (page === 'goals') loadGoals();
            if (page === 'stats') loadChart();
        }

        // ==================== 初始化 ====================
        renderPracticeGrid();
    </script>
</body>
</html>
