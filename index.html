<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸訓練日記 · 專業版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-gold: #ffd700;
            --bg-gradient: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); min-height: 100vh; color: white; overflow-x: hidden; }
        
        /* 導航 */
        .nav-bar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1rem; cursor: pointer; transition: 0.3s; padding: 5px 10px; }
        .nav-btn.active { color: var(--primary-gold); font-weight: bold; }

        /* 頁面切換 */
        .page { display: none; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .container { max-width: 480px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }

        /* 標題與網格 */
        .section-title { font-size: 1.1rem; color: var(--primary-gold); margin: 25px 0 10px; border-left: 4px solid var(--primary-gold); padding-left: 10px; display: flex; justify-content: space-between; align-items: center; }
        .practice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .practice-card { background: rgba(255,255,255,0.08); padding: 18px; border-radius: 16px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; position: relative; }
        .practice-card:hover { background: rgba(255,255,255,0.12); }
        .practice-card.selected { border-color: var(--primary-gold); background: rgba(255,215,0,0.05); }
        .practice-card.locked { opacity: 0.5; filter: grayscale(1); }
        .practice-card.locked::after { content: '🔒'; position: absolute; top: 10px; right: 10px; font-size: 0.8rem; }
        .practice-card h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--primary-gold); }
        .practice-card p { font-size: 0.8rem; opacity: 0.7; line-height: 1.3; }

        /* 解鎖按鈕區 */
        .unlock-area { text-align: center; margin: 20px 0; }
        .btn-unlock { background: var(--primary-gold); color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        /* 控制面板 */
        .control-panel { margin-top: 20px; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; display: none; }
        
        /* 新增練習說明區塊 */
        .practice-detail { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .practice-detail .title { font-size: 0.9rem; color: #ffd700; margin-bottom: 5px; }
        .practice-detail .content { font-size: 0.85rem; line-height: 1.5; }

        .level-group { display: flex; gap: 10px; margin: 15px 0; }
        .btn-level { flex: 1; padding: 8px; border: 1px solid rgba(255,255,255,0.3); background: none; color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .btn-level.active { background: var(--primary-gold); color: black; border-color: var(--primary-gold); }
        
        .slider-box { margin-bottom: 15px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; appearance: none; background: #444; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: var(--primary-gold); border-radius: 50%; cursor: pointer; }

        /* 呼吸動畫區域 */
        .breathing-area { position: relative; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 20px 0; }
        .breath-circle { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fceabb, #f8b500); box-shadow: 0 0 50px rgba(255, 215, 0, 0.3); transition: transform 1s linear; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .breath-circle.belly-mode { width: 180px; height: 120px; border-radius: 50% / 60% 60% 40% 40%; background: radial-gradient(circle at center, #ffdb99, #e69500); }
        .phase-label { font-size: 1.8rem; font-weight: bold; color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.5); text-align: center; }
        .timer-display { font-size: 4rem; font-weight: 200; text-align: center; line-height: 1; }
        .instruction-text { font-size: 0.9rem; color: #aaa; text-align: center; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; display: none; }

        /* 按鈕 */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary-gold); color: #000; }
        .btn-danger { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }

        /* 安全警告彈窗 */
        .warning-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .warning-box { background: #222; border: 2px solid #ff4757; padding: 25px; border-radius: 20px; max-width: 400px; }

        /* 紀錄卡片 */
        .log-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* 創作者面板 */
        #adminPanel { background: #111; border: 1px dashed var(--primary-gold); padding: 15px; margin-top: 30px; border-radius: 10px; display: none; text-align: center; }
    </style>
</head>

        function speak(text) {
            if (!state.voiceEnabled || !window.speechSynthesis) return;
            
            window.speechSynthesis.cancel(); // 中斷前一個語音
            
            let cleanText = text.replace(/Hold \d+/gi, 'hold住').replace(/Hold/gi, 'hold住').replace(/^H$/, 'hold住');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);

            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);

            if (code === 'breath2026') { unlockSuccess(); return; }

            if (sb) {
                const { data } = await sb.from('breathing_otps').select('*').eq('code', code).eq('is_used', false).single();
                if (data) {
                    await sb.from('breathing_otps').update({ is_used: true }).eq('code', code);
                    unlockSuccess();
                } else {
                    alert("密碼無效或已被使用。");
                }
            } else {
                alert("無法連線至驗證伺服器，請使用預設密碼 ");
            }
        }

        function unlockSuccess() {
            state.unlocked = true;
            SafeStorage.set('adv_unlocked', 'true');
            alert("進階練習已永久解鎖！");
            renderGrids();
        }

        function triggerAdmin() {
            const p = prompt("Creator Password:");
            if(p === MASTER_PW) document.getElementById('adminPanel').style.display = 'block';
        }
        
        async function generateOTP() {
            const code = 'B-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            if(sb) await sb.from('breathing_otps').insert([{ code: code }]);
            document.getElementById('otpDisplay').innerText = code;
        }

        function selectPractice(id, isAdv) {
            state.isBase = !isAdv;
            state.sel = (isAdv ? advPractices : basePractices).find(p => p.id === id);
            
            document.querySelectorAll('.practice-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');

            document.getElementById('controlPanel').style.display = 'block';
            
            // 顯示練習詳細說明
            const detailDiv = document.getElementById('practiceDetail');
            const detailText = document.getElementById('detailText');
            if (state.sel) {
                let detail = state.sel.desc;
                if (state.sel.hint) detail += '。' + state.sel.hint;
                detailText.innerText = detail;
                detailDiv.style.display = 'block';
            } else {
                detailDiv.style.display = 'none';
            }

            const baseControls = document.getElementById('baseControls');
            
            if (state.isBase || state.sel.hasSlider) {
                baseControls.style.display = 'block';
                setLevel('simple');
            } else {
                baseControls.style.display = 'none';
            }

            document.getElementById('startBtn').innerText = `開始「${state.sel.name}」`;
        }

        function setLevel(lv) {
            state.level = lv;
            document.querySelectorAll('.btn-level').forEach(b => {
                b.classList.toggle('active', b.innerText === (lv==='simple'?'簡單':lv==='advanced'?'進階':'高階'));
            });
            const vals = state.sel.levels[lv];
            state.in = vals[0];
            state.ex = vals[1];
            updateSliderUI();
        }

        function setupInputs() {
            const rIn = document.getElementById('rangeIn');
            const rEx = document.getElementById('rangeEx');
            rIn.oninput = (e) => {
                state.in = parseInt(e.target.value);
                if (state.sel && state.sel.type === 'ratio_12') state.ex = state.in * 2;
                updateSliderUI();
            };
            rEx.oninput = (e) => {
                state.ex = parseInt(e.target.value);
                updateSliderUI();
            };
        }

        function updateSliderUI() {
            document.getElementById('rangeIn').value = state.in;
            document.getElementById('rangeEx').value = state.ex;
            document.getElementById('txtIn').innerText = state.in + 's';
            document.getElementById('txtEx').innerText = state.ex + 's';
        }

        // --- 核心練習引擎 (修復版) ---
        function startSession() {
            if (state.sel.warn) document.getElementById('warningOverlay').style.display = 'flex';
            else launchEngine();
        }
        
        function acceptWarningAndStart() {
            document.getElementById('warningOverlay').style.display = 'none';
            launchEngine();
        }

        function launchEngine() {
            // 先清除可能存在的舊計時器
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }

            showPage('training');
            document.getElementById('curTitle').innerText = state.sel.name;
            
            const inst = document.getElementById('instructionTxt');
            if(state.sel.hint) { inst.innerText = state.sel.hint; inst.style.display = 'block'; }
            else { inst.style.display = 'none'; }

            document.getElementById('circle').className = 'breath-circle' + (state.sel.type === 'belly' ? ' belly-mode' : '');
            
            if (state.isBase || state.sel.hasSlider) {
                state.currSeq = [{n:'吸氣', t:state.in, s:1.5}, {n:'吐氣', t:state.ex, s:0.8}];
            } else {
                state.currSeq = state.sel.seq;
            }

            state.sec = 0; state.pSec = 0; state.phase = 0; state.cycles = 0;
            document.getElementById('statCycles').innerText = '0';
            
            // 語音：歡迎詞 + 第一階段
            const firstPhaseText = state.currSeq[0].n;
            speak(`開始 ${state.sel.name} 練習。${firstPhaseText}`);
            
            runPhase(true);
            state.timer = setInterval(tick, 1000);
        }

        function tick() {
            state.sec++; state.pSec++;
            const seq = state.currSeq[state.phase];

            const m = Math.floor(state.sec / 60);
            const s = state.sec % 60;
            document.getElementById('statTime').innerText = `${m}:${s.toString().padStart(2, '0')}`;

            if (state.sel.isTest) {
                document.getElementById('timerTxt').innerText = state.pSec;
            } else {
                const remain = seq.t - state.pSec;
                document.getElementById('timerTxt').innerText = Math.max(0, remain);
                
                // 倒數語音 (僅在練習進行中)
                if (remain <= 5 && remain > 0) {
                    speak(remain.toString());
                }

                if (state.pSec >= seq.t) {
                    state.pSec = 0;
                    state.phase++;
                    if (state.phase >= state.currSeq.length) {
                        state.phase = 0;
                        state.cycles++;
                        document.getElementById('statCycles').innerText = state.cycles;
                    }
                    runPhase();
                }
            }
        }

        function runPhase(isFirst = false) {
            const seq = state.currSeq[state.phase];
            document.getElementById('phaseTxt').innerText = seq.n;
            const circle = document.getElementById('circle');
            circle.style.transition = `transform ${state.sel.isTest ? 0.5 : seq.t}s linear`;
            circle.style.transform = `scale(${seq.s})`;
            
            if (!isFirst && !state.sel.isTest) {
                speak(seq.n);
            }
        }

        async function stopSession() {
            // 停止計時器
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }

            // 強制中斷所有語音
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            // 語音：結束鼓勵語 (但需確保在 cancel 後播放)
            speak('練習完成，你好棒！');
            
            const notes = state.sel.isTest ? `極限屏息: ${state.pSec}秒` : `完成 ${state.cycles} 循環`;
            const record = {
                practice_name: state.sel.name, duration_seconds: state.sec, cycles: state.cycles, notes: notes, created_at: new Date().toISOString()
            };

            const logs = JSON.parse(SafeStorage.get('breath_logs_pro') || '[]');
            logs.unshift(record);
            SafeStorage.set('breath_logs_pro', JSON.stringify(logs.slice(0, 50)));

            if (sb) await sb.from('practice_records').insert([record]);

            alert(`練習完成！\n${notes}`);
            showPage('home');
        }

        // 修正 showPage：當從訓練頁返回首頁時，強制停止訓練並取消語音
        function showPage(id) {
            // 如果要切換到首頁，且目前正在訓練中（計時器存在），則強制停止訓練（不儲存）
            if (id === 'home' && state.timer) {
                clearInterval(state.timer);
                state.timer = null;
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                // 重置計時狀態（避免下次開始時殘留）
                state.sec = 0; state.pSec = 0; state.phase = 0; state.cycles = 0;
            }

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(id));
            });
            if (id === 'records') loadLogs();
            if (id === 'stats') renderChart();
        }

        function loadLogs() {
            const container = document.getElementById('logContainer');
            const logs = JSON.parse(SafeStorage.get('breath_logs_pro') || '[]');
            if (!logs.length) { container.innerHTML = '<p style="text-align:center; opacity:0.5;">尚無紀錄</p>'; return; }

            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <div><div style="font-weight:bold; color:var(--primary-gold)">${l.practice_name}</div><small style="opacity:0.6">${new Date(l.created_at).toLocaleString()}</small></div>
                    <div style="text-align:right"><div>${l.notes}</div><small>${Math.floor(l.duration_seconds/60)}分${l.duration_seconds%60}秒</small></div>
                </div>
            `).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('statChart').getContext('2d');
            const logs = JSON.parse(SafeStorage.get('breath_logs_pro') || '[]').reverse();
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => new Date(l.created_at).getDate() + '日'),
                    datasets: [{ label: '練習時間(秒)', data: logs.map(l => l.duration_seconds), borderColor: '#ffd700', backgroundColor: 'rgba(255, 215, 0, 0.1)', fill: true, tension: 0.4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } }
            });
        }
    </script>
</body>
</html>
