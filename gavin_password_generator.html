<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gavin Chan 神經力學 | 批次密碼生成器 · 講師專用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0A0F1E 0%, #03060E 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(17, 22, 31, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 1px solid rgba(43, 110, 240, 0.5);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFFFFF, #00D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }
        .badge {
            background: #2B6EF0;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .batch-area {
            background: #0C111C;
            border-radius: 24px;
            padding: 1.2rem;
            margin: 1rem 0;
        }
        textarea {
            width: 100%;
            height: 180px;
            background: #1E2533;
            border: 1px solid #2A3342;
            border-radius: 20px;
            padding: 1rem;
            color: #E9F1FC;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #2B6EF0;
        }
        .batch-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        button {
            background: #2B6EF0;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button.secondary {
            background: #2A3342;
        }
        button.danger {
            background: #7A2E2E;
        }
        button:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .code-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .code-table th, .code-table td {
            border-bottom: 1px solid #2A3342;
            padding: 12px 8px;
            text-align: left;
        }
        .code-table th {
            color: #00D4FF;
            font-weight: 500;
            background: #0F172A;
        }
        .code-value {
            font-family: monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #7BC9FF;
            cursor: pointer;
        }
        .code-value:hover {
            color: #2B6EF0;
            text-decoration: underline;
        }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-active {
            background: #1F5A2E;
            color: #8AFFB0;
        }
        .status-used {
            background: #5A2E2E;
            color: #FFA07A;
        }
        .copy-all-btn {
            background: #1F5A2E;
            margin-left: 0.5rem;
        }
        .info-text {
            color: #8A99B4;
            font-size: 0.8rem;
            margin-top: 0.8rem;
        }
        .stats {
            display: flex;
            gap: 1.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #0F172A;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
        .search-box {
            margin: 1rem 0;
            display: flex;
            gap: 0.5rem;
        }
        .search-box input {
            background: #1E2533;
            border: 1px solid #2A3342;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: white;
            flex: 1;
        }
        hr {
            border-color: #2A3342;
            margin: 1rem 0;
        }
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .code-table th, .code-table td { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🔐 Gavin 神經力學</h1>
        <div class="badge">講師專用 · 批次密碼生成器</div>
        <p style="color: #B0C4FF; margin-bottom: 1rem;">一次性貼上學員名單，自動產生每人專屬 12 碼一次性密碼。<br>每個密碼僅限單一裝置使用，學員需手動輸入密碼進入筆記。</p>
        
        <!-- 批次輸入區 -->
        <div class="batch-area">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">📋 學員名單 (一行一個姓名或ID)</label>
            <textarea id="studentList" placeholder="範例：
王小明
陳美華
張志豪
李佳穎
林書瑜"></textarea>
            <div class="batch-actions">
                <button id="batchGenerateBtn">✨ 批次生成密碼</button>
                <button id="clearAllBtn" class="secondary">🗑️ 清除所有密碼</button>
                <button id="copyAllCodesBtn" class="secondary copy-all-btn">📋 複製全部密碼</button>
            </div>
            <div class="info-text">
                💡 支援中英文、數字、Email格式，每行一位學員。系統將為每位學員產生唯一12碼密碼。<br>
                📌 點擊密碼即可單獨複製，已使用的密碼會標記為「已使用」。
            </div>
        </div>
        
        <!-- 統計與搜尋 -->
        <div class="stats" id="statsArea"></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋學員姓名或密碼..." autocomplete="off">
        </div>
        
        <!-- 密碼列表表格 -->
        <div style="overflow-x: auto;">
            <table class="code-table" id="codeTable">
                <thead>
                    <tr>
                        <th style="width: 30%;">學員姓名 / 備註</th>
                        <th style="width: 35%;">一次性密碼 (12碼)</th>
                        <th style="width: 20%;">狀態</th>
                        <th style="width: 15%;">操作</th>
                    </tr>
                </thead>
                <tbody id="codeTableBody">
                    <tr><td colspan="4" style="text-align:center; color:#6E7C9A;">尚無密碼，請輸入學員名單並點擊「批次生成」</td></tr>
                </tbody>
            </table>
        </div>
        
        <hr>
        <div class="batch-actions" style="justify-content: space-between; flex-wrap: wrap;">
            <button id="exportCsvBtn" class="secondary">📎 匯出 CSV 檔</button>
            <button id="resetAllBtn" class="danger">⚠️ 重置所有密碼 (清空全部)</button>
        </div>
        <div class="info-text">
            🔒 密碼狀態說明：<strong class="status-active" style="background:#1F5A2E;">待使用</strong> 尚未啟用 │ <strong class="status-used" style="background:#5A2E2E;">已使用</strong> 學員已解鎖過，無法再次使用<br>
            📋 每個密碼僅限一人、一裝置使用。學員首次進入筆記時需輸入此密碼。
        </div>
    </div>
</div>

<script>
    // ---------- 儲存 KEY ----------
    const STORAGE_KEY = "Gavin_Batch_Passwords";
    
    // 產生隨機 12 碼密碼 (大寫英文+數字，無混淆字元)
    function generateRandomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 12; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }
    
    // 確保密碼不重複
    function getUniqueCode(existingCodes) {
        let newCode;
        do {
            newCode = generateRandomCode();
        } while (existingCodes.includes(newCode));
        return newCode;
    }
    
    // 載入密碼列表
    function loadPasswords() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) {
                return [];
            }
        }
        return [];
    }
    
    // 儲存密碼列表
    function savePasswords(passwords) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(passwords));
        renderTable();
        updateStats();
    }
    
    // 批次生成：根據學員姓名清單 (每行一個)
    function batchGenerate(studentNamesArray) {
        const existingPasswords = loadPasswords();
        const existingCodes = existingPasswords.map(p => p.code);
        const existingNames = existingPasswords.map(p => p.name);
        
        const newEntries = [];
        for (let rawName of studentNamesArray) {
            let name = rawName.trim();
            if (name === "") continue;
            // 若已有相同姓名，跳過不重複新增 (保留原有)
            if (existingNames.includes(name)) {
                continue;
            }
            const newCode = getUniqueCode(existingCodes.concat(newEntries.map(e => e.code)));
            newEntries.push({
                name: name,
                code: newCode,
                status: "active",
                createdAt: Date.now()
            });
        }
        
        if (newEntries.length === 0) {
            alert("沒有新增任何學員，請確認名單是否已存在或格式正確");
            return;
        }
        
        const updatedList = [...existingPasswords, ...newEntries];
        savePasswords(updatedList);
        alert(`✅ 成功新增 ${newEntries.length} 位學員，共產生 ${newEntries.length} 組密碼。`);
    }
    
    // 更新密碼狀態 (由筆記頁面調用，這裡提供對外介面，但實際由筆記頁面修改)
    // 但為了同步，筆記頁面也會直接操作 localStorage，此處會自動同步渲染
    function markCodeAsUsed(code) {
        const passwords = loadPasswords();
        const idx = passwords.findIndex(p => p.code === code);
        if (idx !== -1 && passwords[idx].status === "active") {
            passwords[idx].status = "used";
            savePasswords(passwords);
            return true;
        }
        return false;
    }
    
    // 刪除單一密碼
    function deletePassword(code) {
        let passwords = loadPasswords();
        passwords = passwords.filter(p => p.code !== code);
        savePasswords(passwords);
    }
    
    // 重置所有密碼
    function resetAll() {
        if (confirm("⚠️ 確定要刪除所有密碼？\n這將使所有已發送的密碼失效，學員將無法進入筆記。")) {
            localStorage.removeItem(STORAGE_KEY);
            renderTable();
            updateStats();
            alert("已清空所有密碼");
        }
    }
    
    // 複製單一密碼
    function copyCode(code, name) {
        navigator.clipboard.writeText(code).then(() => {
            alert(`✅ 已複製密碼: ${code}\n學員: ${name}\n請發送給學員。`);
        }).catch(() => {
            alert("複製失敗，請手動複製");
        });
    }
    
    // 複製全部密碼 (格式: 姓名,密碼)
    function copyAllCodes() {
        const passwords = loadPasswords();
        if (passwords.length === 0) {
            alert("沒有密碼可複製");
            return;
        }
        let text = "學員姓名,一次性密碼,狀態\n";
        passwords.forEach(p => {
            text += `${p.name},${p.code},${p.status === 'active' ? '待使用' : '已使用'}\n`;
        });
        navigator.clipboard.writeText(text).then(() => {
            alert(`已複製 ${passwords.length} 筆密碼資料至剪貼簿`);
        });
    }
    
    // 匯出 CSV
    function exportToCSV() {
        const passwords = loadPasswords();
        if (passwords.length === 0) {
            alert("無資料可匯出");
            return;
        }
        let csvContent = "\uFEFF學員姓名,一次性密碼,狀態,建立時間\n";
        passwords.forEach(p => {
            const date = new Date(p.createdAt).toLocaleString();
            csvContent += `"${p.name}","${p.code}","${p.status === 'active' ? '待使用' : '已使用'}","${date}"\n`;
        });
        const blob = new Blob([csvContent], {type: "text/csv;charset=utf-8;"});
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", `Gavin_密碼清單_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    // 渲染表格 (含搜尋功能)
    let currentSearchTerm = "";
    
    function renderTable() {
        const passwords = loadPasswords();
        const tbody = document.getElementById('codeTableBody');
        const searchTerm = currentSearchTerm.toLowerCase();
        
        let filtered = passwords;
        if (searchTerm) {
            filtered = passwords.filter(p => 
                p.name.toLowerCase().includes(searchTerm) || 
                p.code.toLowerCase().includes(searchTerm)
            );
        }
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#6E7C9A;">沒有符合的資料，或尚未產生密碼</td></tr>';
            return;
        }
        
        tbody.innerHTML = filtered.map(p => `
            <tr>
                <td><strong>${escapeHtml(p.name)}</strong></td>
                <td><span class="code-value" onclick="window.copyCode('${p.code}', '${escapeHtml(p.name)}')">${p.code}</span></td>
                <td><span class="status-badge ${p.status === 'active' ? 'status-active' : 'status-used'}">${p.status === 'active' ? '待使用' : '已使用'}</span></td>
                <td>
                    <button onclick="window.copyCode('${p.code}', '${escapeHtml(p.name)}')" style="background:#2A3342; padding:4px 12px; font-size:0.7rem;">📋 複製</button>
                    <button onclick="window.deletePassword('${p.code}')" style="background:#5A2E2E; padding:4px 12px; font-size:0.7rem; margin-left:5px;">🗑️</button>
                </td>
            </tr>
        `).join('');
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // 更新統計資訊
    function updateStats() {
        const passwords = loadPasswords();
        const activeCount = passwords.filter(p => p.status === 'active').length;
        const usedCount = passwords.filter(p => p.status === 'used').length;
        const statsDiv = document.getElementById('statsArea');
        statsDiv.innerHTML = `
            <div class="stat-card">📊 總學員數: ${passwords.length}</div>
            <div class="stat-card">🟢 待使用密碼: ${activeCount}</div>
            <div class="stat-card">🔴 已使用密碼: ${usedCount}</div>
        `;
    }
    
    // 解析學員名單 (textarea 每行)
    function parseStudentList(text) {
        const lines = text.split(/\r?\n/);
        const names = [];
        for (let line of lines) {
            let trimmed = line.trim();
            if (trimmed === "") continue;
            names.push(trimmed);
        }
        return names;
    }
    
    // 批次生成事件
    document.getElementById('batchGenerateBtn').addEventListener('click', () => {
        const rawText = document.getElementById('studentList').value;
        if (!rawText.trim()) {
            alert("請在左側區域貼上學員姓名 (一行一個)");
            return;
        }
        const names = parseStudentList(rawText);
        if (names.length === 0) {
            alert("未偵測到有效姓名，請確認格式 (一行一個學員)");
            return;
        }
        batchGenerate(names);
        // 清空輸入區方便下次批次
        document.getElementById('studentList').value = "";
    });
    
    // 清除所有密碼 (保留空列表)
    document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (confirm("⚠️ 確定要清除畫面中所有密碼？此操作不可復原。")) {
            savePasswords([]);
            alert("已清除所有密碼");
        }
    });
    
    document.getElementById('resetAllBtn').addEventListener('click', resetAll);
    document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);
    document.getElementById('copyAllCodesBtn').addEventListener('click', copyAllCodes);
    
    // 搜尋功能
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        currentSearchTerm = e.target.value;
        renderTable();
    });
    
    // 掛載全域函數供 onclick 使用
    window.copyCode = copyCode;
    window.deletePassword = (code) => {
        if (confirm("確定要刪除此密碼？學員將無法使用該密碼進入筆記。")) {
            deletePassword(code);
        }
    };
    
    // 初始化
    renderTable();
    updateStats();
    
    // 提供外部 API 讓筆記頁面驗證密碼 (同一 localStorage，筆記頁面可直接讀取)
    window.GavinBatchAPI = {
        validateAndUse: function(code) {
            const passwords = loadPasswords();
            const idx = passwords.findIndex(p => p.code === code);
            if (idx === -1) return { valid: false, message: "密碼無效" };
            if (passwords[idx].status === "used") return { valid: false, message: "此密碼已被使用過" };
            if (passwords[idx].status === "active") {
                passwords[idx].status = "used";
                savePasswords(passwords);
                return { valid: true, message: "驗證成功", name: passwords[idx].name };
            }
            return { valid: false, message: "密碼狀態異常" };
        },
        checkStatus: function(code) {
            const passwords = loadPasswords();
            const found = passwords.find(p => p.code === code);
            return found ? found.status : "invalid";
        },
        getAllPasswords: function() {
            return loadPasswords();
        }
    };
</script>
</body>
</html>
