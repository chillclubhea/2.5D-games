<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gavin Chan 神經力學筆記 | 密碼生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0A0F1E 0%, #03060E 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: rgba(17, 22, 31, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            border: 1px solid rgba(43, 110, 240, 0.4);
            padding: 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFFFFF, #00D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .sub {
            color: #8A99B4;
            margin-bottom: 2rem;
            border-bottom: 1px solid #232A36;
            display: inline-block;
            padding-bottom: 0.3rem;
        }
        .password-area {
            background: #0C111C;
            border-radius: 60px;
            padding: 1.2rem;
            margin: 1.5rem 0;
            border: 1px dashed #2B6EF0;
        }
        .code {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            font-family: monospace;
            color: #00D4FF;
            background: #00000040;
            padding: 0.5rem;
            border-radius: 36px;
            word-break: break-all;
        }
        .info {
            font-size: 0.85rem;
            color: #A0B3D9;
            margin: 1rem 0;
        }
        button {
            background: #2B6EF0;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin: 0.5rem;
            box-shadow: 0 0 8px rgba(43,110,240,0.4);
        }
        button:hover {
            background: #1A56D0;
            transform: scale(0.97);
        }
        .warning {
            color: #FFA86C;
            font-size: 0.8rem;
            margin-top: 1.2rem;
            border-top: 1px solid #2A3342;
            padding-top: 1rem;
        }
        .badge {
            background: #1E2A3A;
            border-radius: 32px;
            padding: 0.2rem 1rem;
            display: inline-block;
            font-size: 0.75rem;
            color: #B0C8FF;
        }
        footer {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #4C5A72;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🧠 GAVIN · 神經力學</h1>
    <div class="sub">一次性密碼生成器</div>
    <div class="badge">學員專屬 · 單一裝置啟用</div>
    <div class="password-area">
        <div style="font-size:0.8rem; margin-bottom: 0.5rem;">🔐 當前一次性密碼</div>
        <div class="code" id="oneTimeCode">————</div>
        <div class="info">⏳ 此密碼僅能使用一次，且僅限單一裝置。<br>第二台裝置使用相同密碼將自動封鎖。</div>
    </div>
    <button id="generateBtn">🔄 產生新的一次性密碼</button>
    <button id="copyBtn">📋 複製密碼 & 開啟筆記</button>
    <div class="warning">
        ⚡ 機制說明：產生的密碼為 12 位數字+字母混合。<br>
        點擊「開啟筆記」後，系統將生成加密授權 token。<br>
        若在其他裝置重複使用同一密碼，筆記頁面會永久鎖定該密碼。
    </div>
    <footer>© Gavin Chan 神經力學 · 科技樁步態重建 | 密碼僅供單次驗證</footer>
</div>
<script>
    // 產生隨機一次性密碼 (英數混合 12碼)
    function generateRandomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 12; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        // 加入視覺分段 每4碼一組
        return result.match(/.{1,4}/g).join('-');
    }

    let currentCode = null;

    function updateCodeDisplay() {
        currentCode = generateRandomCode();
        document.getElementById('oneTimeCode').innerText = currentCode;
        // 儲存到 sessionStorage 暫時供複製使用 (不跨頁)
        sessionStorage.setItem('lastGeneratedCode', currentCode);
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
        updateCodeDisplay();
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        if (!currentCode) {
            updateCodeDisplay();
        }
        // 複製純密碼 (去除連字號)
        const rawCode = currentCode.replace(/-/g, '');
        navigator.clipboard.writeText(rawCode).then(() => {
            alert(`✅ 密碼 ${currentCode} 已複製！\n即將開啟受保護的學員筆記。\n⚠️ 注意：此密碼僅限首次使用裝置生效，第二台裝置將被封鎖。`);
            // 將密碼與時間戳透過 URL 參數傳遞，筆記頁會驗證一次性及裝置指紋
            const timestamp = Date.now();
            // 使用簡單的 base64 編碼傳遞原始碼 (僅傳遞純密碼)
            const encodedCode = btoa(rawCode);
            // 開啟筆記頁面 (同目錄下筆記本體檔案)
            window.location.href = `gavin_notes_protected.html?code=${encodeURIComponent(encodedCode)}&ts=${timestamp}&origin=generator`;
        }).catch(() => {
            alert("請手動複製密碼，然後點擊確認開啟筆記");
            window.location.href = `gavin_notes_protected.html?code=${btoa(rawCode)}&ts=${Date.now()}&origin=generator`;
        });
    });

    // 初始化時產生一組密碼
    updateCodeDisplay();
</script>
</body>
</html>
