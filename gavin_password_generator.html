<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gavin Chan 神經力學 | 密碼生成器 · 講師專用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0A0F1E 0%, #03060E 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: rgba(17, 22, 31, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            border: 1px solid rgba(43, 110, 240, 0.5);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFFFFF, #00D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .badge {
            background: #2B6EF0;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .code-list {
            background: #0C111C;
            border-radius: 24px;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid #232A36;
            font-family: monospace;
        }
        .code-value {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #00D4FF;
            font-weight: 600;
        }
        .status {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        .status-active { background: #1F5A2E; color: #8AFFB0; }
        .status-used { background: #5A2E2E; color: #FFA07A; }
        button {
            background: #2B6EF0;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0 0;
        }
        button.secondary {
            background: #2A3342;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        input {
            background: #1E2533;
            border: 1px solid #232A36;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            color: white;
            flex: 1;
        }
        .info {
            color: #8A99B4;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        hr {
            border-color: #232A36;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🔐 Gavin 神經力學</h1>
        <div class="badge">講師專用 · 密碼生成器</div>
        <p style="color:#B0C4FF; margin-bottom:1rem;">為每位學員產生專屬一次性密碼。<br>每個密碼僅限單一裝置使用，學員需手動輸入密碼進入筆記。</p>
        
        <div class="input-group">
            <input type="text" id="studentName" placeholder="學員名稱 / 備註 (選填)" style="flex:2;">
            <button id="generateBtn">✨ 產生專屬密碼</button>
        </div>
        
        <div class="code-list">
            <div style="display:flex; justify-content:space-between; padding:0.5rem; color:#6E7C9A;">
                <span>密碼 (12碼)</span>
                <span>狀態</span>
                <span>備註</span>
            </div>
            <div id="codeListContainer">
                <!-- 動態列表 -->
            </div>
        </div>
        
        <div class="info">
            ⚡ 每個密碼僅能使用一次，學員首次進入時需手動輸入密碼。<br>
            📋 點擊密碼即可複製，再分享給對應學員。<br>
            🔒 已被使用的密碼會標記為「已使用」，無法再次進入。
        </div>
        <hr>
        <button id="exportBtn" class="secondary">📎 匯出所有密碼清單</button>
        <button id="resetAllBtn" class="secondary" style="background:#4A2E2E;">🗑️ 重置所有密碼</button>
    </div>
</div>

<script>
    // 儲存密碼的 key
    const STORAGE_KEY = "Gavin_Passwords_List";
    
    // 產生隨機 12 碼密碼 (大寫英文+數字，無連字號)
    function generateRandomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 12; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }
    
    // 載入密碼列表
    function loadPasswords() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) {
                return [];
            }
        }
        return [];
    }
    
    // 儲存密碼列表
    function savePasswords(passwords) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(passwords));
        renderList();
    }
    
    // 新增密碼
    function addPassword(remark = "") {
        const passwords = loadPasswords();
        const newCode = generateRandomCode();
        // 確保不重複
        while (passwords.some(p => p.code === newCode)) {
            newCode = generateRandomCode();
        }
        passwords.push({
            code: newCode,
            status: "active",
            remark: remark || `學員_${newCode.slice(-4)}`,
            createdAt: Date.now()
        });
        savePasswords(passwords);
        return newCode;
    }
    
    // 更新密碼狀態 (由筆記頁面透過 localStorage 跨頁面標記，實際使用時需同步)
    // 此處提供手動標記功能，但學員使用時會自動標記
    function markAsUsed(code) {
        const passwords = loadPasswords();
        const idx = passwords.findIndex(p => p.code === code);
        if (idx !== -1 && passwords[idx].status === "active") {
            passwords[idx].status = "used";
            savePasswords(passwords);
            return true;
        }
        return false;
    }
    
    // 渲染列表
    function renderList() {
        const container = document.getElementById('codeListContainer');
        const passwords = loadPasswords();
        if (passwords.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:2rem; color:#6E7C9A;">暫無密碼，點擊上方按鈕產生</div>';
            return;
        }
        container.innerHTML = passwords.map(p => `
            <div class="code-item" data-code="${p.code}">
                <span class="code-value" style="cursor:pointer;" onclick="copyCode('${p.code}')">${p.code}</span>
                <span class="status ${p.status === 'active' ? 'status-active' : 'status-used'}">${p.status === 'active' ? '待使用' : '已使用'}</span>
                <span style="font-size:0.7rem; color:#8A99B4;">${p.remark}</span>
            </div>
        `).join('');
    }
    
    // 複製密碼
    window.copyCode = function(code) {
        navigator.clipboard.writeText(code).then(() => {
            alert(`✅ 密碼 ${code} 已複製，可發送給學員。\n學員需在筆記頁面手動輸入此密碼。`);
        });
    };
    
    // 匯出清單
    function exportList() {
        const passwords = loadPasswords();
        let text = "Gavin 神經力學筆記 · 一次性密碼清單\n";
        text += "生成時間: " + new Date().toLocaleString() + "\n";
        text += "=".repeat(50) + "\n";
        passwords.forEach(p => {
            text += `密碼: ${p.code}  | 狀態: ${p.status === 'active' ? '待使用' : '已使用'}  | 備註: ${p.remark}\n`;
        });
        const blob = new Blob([text], {type: "text/plain"});
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `Gavin_密碼清單_${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    // 重置所有
    function resetAll() {
        if (confirm("⚠️ 確定要刪除所有密碼？\n這將使所有已發送的密碼失效，學員將無法進入筆記。")) {
            localStorage.removeItem(STORAGE_KEY);
            renderList();
            alert("已清空所有密碼");
        }
    }
    
    // 事件綁定
    document.getElementById('generateBtn').addEventListener('click', () => {
        const remark = document.getElementById('studentName').value;
        addPassword(remark);
        document.getElementById('studentName').value = '';
    });
    
    document.getElementById('exportBtn').addEventListener('click', exportList);
    document.getElementById('resetAllBtn').addEventListener('click', resetAll);
    
    // 初始化渲染
    renderList();
    
    // 提供外部存取介面 (讓筆記頁面可以驗證密碼並標記已使用)
    window.GavinPasswordAPI = {
        validateAndUse: function(code) {
            const passwords = loadPasswords();
            const idx = passwords.findIndex(p => p.code === code);
            if (idx !== -1 && passwords[idx].status === "active") {
                // 標記為已使用
                passwords[idx].status = "used";
                savePasswords(passwords);
                return { valid: true, message: "驗證成功" };
            } else if (idx !== -1 && passwords[idx].status === "used") {
                return { valid: false, message: "此密碼已被使用過，每個密碼僅限一人使用" };
            } else {
                return { valid: false, message: "密碼無效，請確認後重新輸入" };
            }
        },
        checkStatus: function(code) {
            const passwords = loadPasswords();
            const found = passwords.find(p => p.code === code);
            if (!found) return "invalid";
            return found.status;
        }
    };
</script>
</body>
</html>
